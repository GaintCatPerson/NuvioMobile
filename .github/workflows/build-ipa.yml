name: Automated Unsigned IPA Build

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Specific upstream tag to build (e.g., v0.2.21). If empty, the latest upstream release will be built.'
        required: false
        type: string
      force_build:
        description: 'Force build and recreate the release even if it already exists on the fork.'
        required: false
        default: false
        type: boolean
      engine_override:
        description: 'Pin a specific Nuvio Engine version (e.g. v0.1.1) instead of auto-deriving it from the bundled Android AAR. Use when upstream ships a bad engine or you need to hold one.'
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  check-release:
    name: Check Upstream Release
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check latest upstream release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.tag_override }}" ]; then
            TAG="${{ github.event.inputs.tag_override }}"
            echo "Using manually specified tag: $TAG"
          else
            # Fetch latest release tag from upstream repo (using gh api with built-in auth and retries)
            TAG=$(gh api repos/NuvioMedia/NuvioMobile/releases/latest --jq .tag_name)
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "Failed to fetch latest release from upstream."
              exit 1
            fi
            echo "Latest upstream release tag: $TAG"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Check if this release already exists in the fork
          if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "Force build is enabled. Proceeding to build."
            echo "skip=false" >> $GITHUB_OUTPUT
          elif gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists on the fork. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Release $TAG does not exist on the fork. Proceeding to build."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build-ipa:
    name: Build and Package IPA
    needs: check-release
    if: needs.check-release.outputs.skip == 'false'
    runs-on: macos-15
    steps:
      - name: Checkout upstream tag
        uses: actions/checkout@v4
        with:
          repository: 'NuvioMedia/NuvioMobile'
          ref: ${{ needs.check-release.outputs.tag }}
          submodules: 'false'

      - name: Patch Kotlin Composable issue
        run: |
          # 1. Write the clean replacement Kotlin function to a temp file.
          #    Every line in the heredoc is indented 10 spaces (matching the YAML
          #    block scalar); sed strips those 10 spaces so the Kotlin indentation
          #    is preserved exactly.
          cat << 'KOTLINEOF' | sed 's/^          //' > /tmp/streams_replacement.kt
          internal fun LazyListScope.streamsSettingsContent(isTablet: Boolean) {
              item {
                  StreamsSettingsContentItem(isTablet = isTablet)
              }
          }

          @Composable
          private fun StreamsSettingsContentItem(isTablet: Boolean) {
              val currentSettings by remember {
                  StreamBadgeSettingsRepository.ensureLoaded()
                  StreamBadgeSettingsRepository.uiState
              }.collectAsStateWithLifecycle()
              val currentRules = currentSettings.rules
              var showBadgeImportDialog by rememberSaveable { mutableStateOf(false) }
              var showBadgePositionDialog by rememberSaveable { mutableStateOf(false) }
              val badgePlacementLabel = streamBadgePlacementLabel(currentSettings.badgePlacement)
              Column {
                  SettingsSection(
                      title = stringResource(Res.string.settings_stream_badges_section),
                      isTablet = isTablet,
                  ) {
                      SettingsGroup(isTablet = isTablet) {
                          SettingsSwitchRow(
                              title = stringResource(Res.string.settings_stream_size_badges_title),
                              description = stringResource(Res.string.settings_stream_size_badges_description),
                              checked = currentSettings.showFileSizeBadges,
                              isTablet = isTablet,
                              onCheckedChange = StreamBadgeSettingsRepository::setShowFileSizeBadges,
                          )
                          SettingsNavigationRow(
                              title = stringResource(Res.string.settings_stream_badge_position_title),
                              description = badgePlacementLabel,
                              isTablet = isTablet,
                              onClick = { showBadgePositionDialog = true },
                          )
                          SettingsNavigationRow(
                              title = stringResource(Res.string.settings_stream_badge_urls_title),
                              description = badgeRulesPreview(currentRules),
                              isTablet = isTablet,
                              onClick = { showBadgeImportDialog = true },
                          )
                      }
                  }

                  SettingsSection(
                      title = stringResource(Res.string.settings_stream_display_section),
                      isTablet = isTablet,
                  ) {
                      SettingsGroup(isTablet = isTablet) {
                          SettingsSwitchRow(
                              title = stringResource(Res.string.settings_stream_addon_logo_title),
                              description = stringResource(Res.string.settings_stream_addon_logo_description),
                              checked = currentSettings.showAddonLogo,
                              isTablet = isTablet,
                              onCheckedChange = StreamBadgeSettingsRepository::setShowAddonLogo,
                          )
                      }
                  }

                  if (showBadgeImportDialog) {
                      BadgeUrlManagerDialog(
                          currentRules = currentRules,
                          onDismiss = { showBadgeImportDialog = false },
                      )
                  }

                  if (showBadgePositionDialog) {
                      StreamBadgePositionDialog(
                          selectedPlacement = currentSettings.badgePlacement,
                          onPlacementSelected = { placement ->
                              StreamBadgeSettingsRepository.setBadgePlacement(placement)
                              showBadgePositionDialog = false
                          },
                          onDismiss = { showBadgePositionDialog = false },
                      )
                  }
              }
          }
          KOTLINEOF

          # 4. Replace the entire broken streamsSettingsContent function in the
          #    upstream Kotlin file with the clean version from the temp file.
          #    Uses regex to match from the function signature to the closing
          #    brace right before streamBadgePlacementLabel.
          python3 -c "
          import re
          path = 'composeApp/src/commonMain/kotlin/com/nuvio/app/features/settings/StreamsSettingsPage.kt'
          with open(path, 'r') as f:
              kcode = f.read()
          if 'StreamsSettingsContentItem' in kcode:
              print('StreamsSettingsPage.kt already patched, skipping.')
          else:
              with open('/tmp/streams_replacement.kt', 'r') as f:
                  replacement = f.read().rstrip()
              pattern = re.compile(
                  r'internal fun LazyListScope\.streamsSettingsContent\(isTablet: Boolean\) \{.*?\n\}\s*(?=@Composable\s*\nprivate fun streamBadgePlacementLabel)',
                  re.DOTALL,
              )
              new_kcode, count = pattern.subn(replacement, kcode)
              if count > 0:
                  with open(path, 'w') as f:
                      f.write(new_kcode)
                  print(f'Patched StreamsSettingsPage.kt ({count} replacement).')
              else:
                  print('WARNING: streamsSettingsContent function not found — file may have changed upstream.')
          "

      - name: Initialize MPVKit Submodule (with 3 retries)
        run: |
          for i in {1..3}; do
            echo "Attempt $i to initialize MPVKit..."
            git submodule update --init MPVKit && exit 0 || sleep 15
          done
          echo "Failed to initialize submodules after 3 attempts."
          exit 1

      - name: Fetch prebuilt Nuvio Engine XCFramework (full build)
        env:
          # Last-known-good fallback. Auto-derivation should normally override this, but if the
          # upstream libs/ listing is unreachable or changes shape, we degrade to this pinned value
          # instead of breaking the build silently.
          NUVIO_ENGINE_VERSION_FALLBACK: 'v0.1.1'
          UPSTREAM_TAG: ${{ needs.check-release.outputs.tag }}
        run: |
          set -euo pipefail
          # NUVIO_IOS_DISTRIBUTION=full links the native Nuvio Engine (a C++/libtorrent
          # torrent-streaming core). Upstream ships prebuilt Apple XCFrameworks per release;
          # the app expects it at <repo>/../nuvio-engine/platform/apple/NuvioEngine.xcframework.
          #
          # The engine version is coupled upstream ONLY via the Android AAR bundled at
          # composeApp/libs/lib-nuvio-engine-android-<ver>.aar (there is no version ref in
          # build.gradle.kts). To avoid a manual edit every time upstream bumps the engine,
          # we derive the version from that AAR at the tag being built, falling back to the
          # pinned value above if the lookup fails. Manual override via the engine_override input.
          ENGINE_VERSION="${{ github.event.inputs.engine_override }}"
          if [ -z "$ENGINE_VERSION" ]; then
            echo "Deriving Nuvio Engine version from upstream composeApp/libs at tag $UPSTREAM_TAG..."
            # Retry the API lookup: a transient gh/api hiccup must NOT silently fall back to the
            # pinned version, or we could ship a mismatched engine inside a green build.
            # NOTE: we intentionally use --jq '.[].name' (no regex) and match with grep -E below.
            # Embedding the regex in jq's --jq string triggered an invalid-escape parse error under
            # the real CI gojq, which (hidden by 2>/dev/null) silently fell back to the pinned value.
            AAR=""
            for attempt in 1 2 3; do
              AAR=$(gh api "repos/NuvioMedia/NuvioMobile/contents/composeApp/libs?ref=$UPSTREAM_TAG" \
                      --jq '.[].name' 2>/dev/null \
                    | grep -E '^lib-nuvio-engine-android-.*\.aar$' | head -n1 || true)
              if [ -n "$AAR" ]; then break; fi
              echo "  API lookup attempt $attempt returned no AAR; retrying in 5s..."
              sleep 5
            done
            if [ -n "$AAR" ]; then
              DERIVED=$(echo "$AAR" | sed -E 's/^lib-nuvio-engine-android-(.+)\.aar$/v\1/')
              if [[ "$DERIVED" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                ENGINE_VERSION="$DERIVED"
                echo "Derived engine version: $ENGINE_VERSION (from $AAR)"
              else
                echo "::warning::Could not parse engine version from '$AAR'; using fallback $NUVIO_ENGINE_VERSION_FALLBACK."
              fi
            else
              echo "::warning::No bundled engine AAR found at tag $UPSTREAM_TAG (or API unreachable after 3 retries); using fallback $NUVIO_ENGINE_VERSION_FALLBACK."
            fi
          fi
          if [ -z "$ENGINE_VERSION" ]; then
            ENGINE_VERSION="$NUVIO_ENGINE_VERSION_FALLBACK"
            echo "Using fallback engine version: $ENGINE_VERSION"
            echo "::warning::Engine version resolved via FALLBACK ($ENGINE_VERSION), not auto-derived from the tag. Confirm this is intended before trusting the build."
          fi
          echo "NUVIO_ENGINE_VERSION=$ENGINE_VERSION" >> "$GITHUB_ENV"

          WORKSPACE_PARENT="${{ github.workspace }}/.."
          ENGINE_DIR="$WORKSPACE_PARENT/nuvio-engine"
          TARGET_DIR="$ENGINE_DIR/platform/apple"
          ZIP_NAME="nuvio-engine-apple-${ENGINE_VERSION#v}.zip"
          ZIP_URL="https://github.com/NuvioMedia/nuvio-engine/releases/download/${ENGINE_VERSION}/${ZIP_NAME}"

          echo "Fetching Nuvio Engine Apple XCFramework $ENGINE_VERSION..."
          rm -f "/tmp/$ZIP_NAME"
          # Retry transient network blips; fail fast on a real 404 (missing asset).
          curl -fSL --retry 5 --retry-all-errors --retry-delay 10 --max-time 600 \
            -o "/tmp/$ZIP_NAME" "$ZIP_URL"

          rm -rf "$ENGINE_DIR" "/tmp/nuvio-engine-extract"
          mkdir -p "$TARGET_DIR"
          unzip -q "/tmp/$ZIP_NAME" -d "/tmp/nuvio-engine-extract"
          mv "/tmp/nuvio-engine-extract/nuvio-engine-apple-${ENGINE_VERSION#v}/NuvioEngine.xcframework" "$TARGET_DIR/"

          if [ ! -f "$TARGET_DIR/NuvioEngine.xcframework/ios-arm64/libCNuvioEngine.a" ]; then
            echo "ERROR: libCNuvioEngine.a (ios-arm64) missing after extraction."
            exit 1
          fi
          echo "Nuvio Engine XCFramework ready at $TARGET_DIR/NuvioEngine.xcframework"

      - name: Set up Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Download iOS Platform SDK
        run: |
          xcrun simctl list > /dev/null
          xcodebuild -downloadPlatform iOS

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        continue-on-error: true

      - name: Configure environment variables for full build
        run: |
          echo "NUVIO_IOS_DISTRIBUTION=full" >> $GITHUB_ENV
          touch local.properties

      - name: Build Unsigned iOS App
        run: |
          xcodebuild -workspace iosApp/iosApp.xcodeproj/project.xcworkspace \
                     -scheme iosApp \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination "generic/platform=iOS" \
                     -derivedDataPath build \
                     clean build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_STYLE=Manual \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_ENTITLEMENTS=""

      - name: Package IPA
        run: |
          TAG_NAME="${{ needs.check-release.outputs.tag }}"
          VERSION="${TAG_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r "${VERSION}-unsigned.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check-release.outputs.tag }}-unsigned-ipa
          path: "*.ipa"
          if-no-files-found: error

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing release if it exists and force_build is true
          if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "Checking if release exists to delete for force build..."
            if gh release view "${{ needs.check-release.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Deleting release ${{ needs.check-release.outputs.tag }}..."
              gh release delete "${{ needs.check-release.outputs.tag }}" --yes --repo "${{ github.repository }}"
            fi
          fi

          cat << 'EOF' > release_notes.md
          ### 📦 Nuvio Mobile Sideload Build (Version: ${{ env.VERSION }})

          This is an automated, unsigned IPA build of Nuvio Mobile, compiled for sideloading (AltStore, SideStore, TrollStore, Signulous, etc.).

          **Upstream Source:** Built based on https://github.com/NuvioMedia/NuvioMobile at release tag ${{ needs.check-release.outputs.tag }}.

          **Limitations of this build:**
          * **Cloud Features Disabled**: Since this build does not connect to the official private Supabase backend, cloud sync, online accounts, and cloud backup features do not work. The app operates in local/offline mode.

          *All local features (local playback, setting up custom Stremio addons, and offline collections) work as expected.*
          EOF

          gh release create "${{ needs.check-release.outputs.tag }}" "${{ env.VERSION }}-unsigned.ipa" \
            --repo "${{ github.repository }}" \
            --title "${{ needs.check-release.outputs.tag }}" \
            --notes-file release_notes.md

  notify-failure:
    name: Notify on Build Failure
    needs: build-ipa
    if: failure() && needs.build-ipa.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          RUN_URL="${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}"
          TAG="${{ needs.check-release.outputs.tag }}"
          TITLE="🚨 Automated IPA build is failing"
          MARKER="<!-- ipa-build-failure -->"
          BODY="$MARKER
          The **Automated Unsigned IPA Build** failed.

          - **Upstream tag attempted:** \`$TAG\`
          - **Run:** $RUN_URL
          - **Triggered by:** ${{ github.event_name }}

          Open the run log for the failing step. Common causes: upstream changed the Nuvio Engine
          coupling (auto-derivation falls back to a pinned version), the engine release asset is not
          yet published for a brand-new upstream tag, or a transient infra blip. Fix and re-run, or
          set \`engine_override\` if a specific engine version must be held."

          # Find an existing open issue with the marker; update it, else create one.
          EXISTING=$(gh issue list --repo "$REPO" --state open --label ci \
            --json number,body --jq ".[] | select(.body | contains(\"$MARKER\")) | .number" 2>/dev/null | head -n1 || true)
          if [ -n "$EXISTING" ]; then
            echo "Updating existing failure issue #$EXISTING"
            gh issue edit "$EXISTING" --repo "$REPO" --title "$TITLE" --body "$BODY" 2>/dev/null || true
            gh issue comment "$EXISTING" --repo "$REPO" --body "Still failing — latest run: $RUN_URL" 2>/dev/null || true
          else
            echo "Creating failure issue"
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" --label "ci" 2>/dev/null || true
          fi
